# Dashboard3D Game Mode overlay — proves which GPU is rendering.
#
# Enabled by dashboard3d-gamemode.sh setting MANGOHUD=1 and pointing
# MANGOHUD_CONFIGFILE here. Shift+R+F12 toggles in-game.

# --- what to show ---
gpu_name              # the line that answers "iGPU or dGPU?"
gpu_stats             # usage %
gpu_temp              # °C
vram                  # VRAM used / total
cpu_stats             # CPU usage %
cpu_temp              # °C
ram                   # system RAM
fps                   # frames per second
frametime             # frame time in ms
engine_version        # OpenGL/Vulkan driver line — confirms backend
vulkan_driver         # which Vulkan ICD is active (radv = iGPU, nvidia = dGPU)
arch                  # 64-bit vs 32-bit Steam runtime

# --- where + how big ---
position=top-left
font_size=24          # large so it's photographable
background_alpha=0.6
round_corners=8
text_outline=1

# --- behaviour ---
no_display=0          # show by default; user can toggle
toggle_hud=Shift_R+F12
