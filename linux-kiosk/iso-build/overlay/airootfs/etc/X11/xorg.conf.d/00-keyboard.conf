# Dashboard3D appliance — force a clean, generic keyboard map.
#
# The ASUS laptop's auto-detected XKB model produces conflicting symbol
# definitions (the FK23/FK24 "Symbol map ... redefined" warnings in the
# Xorg log). The X server tolerates a messy keymap — "Errors from
# xkbcomp are not fatal to the X server" — but Chromium's stricter
# keymap compiler (xkbcommon) does not. Result: every Chromium-based
# app (the Electron dashboard AND Steam, whose UI is CEF/Chromium) can
# no longer translate keypresses into characters, so typing is dead in
# both — while anything that bypasses the keymap (raw X keycode grabs,
# the evdev media-key daemon, the kernel-console keymap) keeps working.
#
# A plain pc105 / us map has no such conflict and compiles cleanly.
Section "InputClass"
    Identifier "dashboard3d-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
EndSection
