# Dashboard3D appliance — the 'gamer' account that runs the whole session.
#
# The appliance session (gamescope + the dashboard + Steam) runs as this
# unprivileged user, auto-logged-in on tty1 — one uid for everything, so
# Steam can reach the display gamescope owns. systemd-sysusers creates it
# at boot; its login shell is the appliance session script.
u  gamer  1000  "Gamer"  /home/gamer  /usr/local/bin/dashboard3d-session
m  gamer  video
m  gamer  render
m  gamer  input
m  gamer  audio
m  gamer  wheel
