# The appliance runs on the AMD APU. On hybrid AMD+NVIDIA laptops the
# internal panel is wired to the APU, and the open NVIDIA driver (nouveau /
# NVK) is unreliable on recent GPUs — leaving it active makes gamescope pick
# a broken Vulkan device and crash-loop. Disabling it leaves exactly one
# GPU, which is what we want for a clean appliance boot.
blacklist nouveau
install nouveau /usr/bin/false

# Stop amdgpu from auto-loading. The archiso initramfs ships the amdgpu
# driver but not the GPU firmware, so an early load makes the display
# microcontroller (DMCUB) fail for the whole session. The appliance session
# modprobes amdgpu explicitly once the full /lib/firmware is mounted.
# (Plain `blacklist` only blocks udev auto-load — explicit modprobe still
# works — so there is no `install` line here.)
blacklist amdgpu

# Stop the proprietary NVIDIA driver from auto-loading. The dashboard runs
# on the AMD APU and the dGPU stays powered down for a cool, quiet boot.
# Game Mode modprobes nvidia on demand. Plain `blacklist` only blocks udev
# auto-load — an explicit modprobe still works.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
