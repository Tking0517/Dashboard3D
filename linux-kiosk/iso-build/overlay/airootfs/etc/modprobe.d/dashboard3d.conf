# Block the open NVIDIA driver (nouveau / NVK) — it's unreliable on recent
# RTX cards. With it gone we either run on the proprietary nvidia driver or
# on the iGPU, whichever the rest of the appliance configures.
blacklist nouveau
install nouveau /usr/bin/false

# Stop amdgpu from auto-loading. The archiso initramfs ships the amdgpu
# driver but not the GPU firmware, so an early load makes the display
# microcontroller (DMCUB) fail for the whole session. The appliance
# prep service modprobes amdgpu explicitly once /lib/firmware is mounted.
# (Plain `blacklist` only blocks udev auto-load — explicit modprobe still
# works — so there is no `install` line here.)
blacklist amdgpu

# nvidia loads normally at boot (udev autoload). It is NOT blacklisted
# anymore — instead we rely on NVIDIA Dynamic Power Management (RTD3) to
# keep the dGPU cool at idle. With fine-grained RTD3 the driver drops
# the GPU into D3cold (power rail OFF, ~0W) whenever no app is using it,
# and wakes it in milliseconds when a PRIME-offloaded game opens the
# device. This gives "nvidia always available + cool quiet idle" — the
# same behavior Windows' Optimus provides — without the modprobe-on-
# demand dance that broke Game Mode's DRM handoff.
#
#   NVreg_DynamicPowerManagement
#     0x00 = disabled   0x01 = coarse   0x02 = fine-grained (also powers
#     down video memory — the aggressive setting, best for laptops).
#
# The companion udev rule /etc/udev/rules.d/80-dashboard3d-nvidia-pm.rules
# sets power/control=auto on the GPU + its PCI sibling functions so the
# kernel actually runtime-suspends them. Verify at runtime with:
#   cat /sys/bus/pci/devices/<id>/power/runtime_status   -> 'suspended'
options nvidia NVreg_DynamicPowerManagement=0x02
